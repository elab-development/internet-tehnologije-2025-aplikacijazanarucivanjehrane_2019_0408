version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: foodapp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: food_order_app_new
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - foodapp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodapp-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: 
      DB_NAME: food_order_app_new
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - foodapp-network

  frontend:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: foodapp-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - foodapp-network

volumes:
  mysql_data:

networks:
  foodapp-network:
    driver: bridge