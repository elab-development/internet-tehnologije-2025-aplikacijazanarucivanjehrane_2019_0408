version: '3.8'

services:
  # MySQL baza
  mysql:
    image: mysql:8.0
    container_name: foodapp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: food_order_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - foodapp-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodapp-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: food_order_app
      DB_PORT: 3306
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - foodapp-network
    command: sh -c "sleep 10 && node app.js"

  # Frontend React app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodapp-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - foodapp-network

volumes:
  mysql_data:

networks:
  foodapp-network:
    driver: bridge